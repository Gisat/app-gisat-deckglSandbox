# Tileserver-RS demo stack — server-side COG rendering + in-process caching.
#
# Image: BUILT FROM ../tileserver-rs (branch feat/identity-raster-cache, which
#        adds identity raster-tile caching to the global [cache]) — the published
#        ghcr.io/vinayakkulkarni/tileserver-rs does NOT yet cache plain PNG
#        raster tiles, and "caching utilized" is part of the demo motivation.
#        The Dockerfile there includes the `stac` feature (implies raster/GDAL).
#        NOTE: the repo has uninitialized submodules — the build checks them
#        out itself (submodules: recursive is in .github; plain `docker build`
#        needs the maplibre-native vendor only for mbgl — see USAGE.md
#        "Building the image" if the build fails on it).
#
# Source (see config.toml):
#   manila-rgb — the same true-color RGB COG as the TiTiler Manila demo
#
# Start:   docker compose -f deploy/tileserver/docker-compose.yml up -d --build
# Health:  curl http://localhost:8080/health
# Tiles:   http://localhost:8080/data/manila-rgb/{z}/{x}/{y}.png
#
# HISTORY 2026-10-14: the STAC-based demo was retired.
#   - sentinel2-mosaic (Earth Search STAC dynamic /search + mosaic) was
#     removed — the STAC configuration test case failed (low-zoom tiles mostly
#     black: `pixel_selection = "first"` picks the newest scenes which are
#     89-99 % cloud in this region). Replaced by a plain, proven COG.
#   - worldcereal COG was removed earlier — failed at startup registration
#     (GDAL GDALOpenEx returned NULL) and the WorldCereal STAC API is dead.
#
# The sandbox app reaches it same-origin via the Vite dev-server proxy
# '/tileserver' -> http://localhost:8080 (COEP-safe; see vite.config.js).

services:
  tileserver:
    # Build from the local tileserver-rs checkout (with the cache patch) so the
    # demo exercises the full feature set. Resolved relative to THIS compose
    # file (deploy/tileserver/): ../../../tileserver-rs = the sibling repo
    # DynamicServerSideTiles/tileserver-rs (checkout must be on the
    # feat/identity-raster-cache branch).
    build:
      context: ../../../tileserver-rs
      args:
        FEATURES: "frontend stac"
    image: tileserver-rs-demo:local
    container_name: tileserver-rs-demo
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      # GDAL /vsicurl/ tuning for the remote Manila COG.
      # From the verified analysis in DynamicServerSideTiles/TITILER_VS_TILESERVER_RS.md §5.
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.TIF,.tiff
      - CPL_VSIL_CURL_CACHE_SIZE=536870912
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=5000000
      - GDAL_CACHEMAX=200
      - GDAL_BAND_BLOCK_CACHE=HASHSET
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      # Do NOT set GDAL_INGESTED_BYTES_AT_OPEN here: the COG path re-opens per
      # overview level, so ingest-at-open = a full-file download per tile.
    # Default CMD from the image: ./tileserver-rs --config /app/config.toml
    # (entrypoint boots Xvfb for headless GL, then exec "$@").
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
