# /etc/nsswitch.conf — glibc Name Service Switch configuration.
#
# REQUIRED in this offline runtime image: debian:12-slim ships no
# /etc/nsswitch.conf, so glibc's getaddrinfo() (used in-process by
# GDAL /vsicurl/ -> libcurl) has no `hosts:` source and fails with
# "Could not resolve host" -> "HTTP response code: 0" -> GDALOpenEx NULL ->
# the remote COG source never registers ("Loaded 0 tile source(s)") and every
# /data/... request 404s.
#
# Note this fails only for the *in-process* resolver path: `getent hosts` still
# resolves (glibc falls back to its own defaults), which is why the breakage is
# easy to miss. The `dns` source below is what libcurl needs; it is satisfied by
# libnss_dns.so.2, shipped via runtime-libs/ (collected by
# collect-runtime-libs.sh, which ldd alone cannot see because glibc dlopen()s
# it). Keep this file minimal — the image only needs host resolution.
passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
