# ============================================================================
# tileserver-rs configuration — Tileserver-RS demo sources
#
# Motivation: demonstrate STAC discovery, mosaicing, and in-process caching.
#
# One source:
#   sentinel2-mosaic — TRUE STAC demo: Earth Search (element84) Sentinel-2
#                      L2A, dynamic per-tile /search + mosaic compositing.
#
# NOTE 2026-10-14: the former `worldcereal` COG source was removed entirely.
# It failed at startup registration — GDAL 'GDALOpenEx' returned a NULL
# pointer ("Failure writing output to destination") — and the public
# WorldCereal STAC API is dead (stac.worldcereal.org NXDOMAIN), so there was
# no path to a healthy WorldCereal source here. The TiTiler WorldCereal demo
# (deploy/titiler) is unaffected.
#
# Tiles:    /data/{source-id}/{z}/{x}/{y}.png
# TileJSON: /data/{source-id}.json
# ============================================================================

[server]
host = "0.0.0.0"
port = 8080
cors_origins = ["*"]

[telemetry]
enabled = false

# ---------------------------------------------------------------------------
# Global raster defaults (the `stac` feature implies `raster`/GDAL).
# ---------------------------------------------------------------------------
[raster]
default_resampling = "bilinear"
tile_size = 256

# ---------------------------------------------------------------------------
# In-process byte-weighted tile cache (moka). With the identity-raster-cache
# patch (../tileserver-rs, branch feat/identity-raster-cache — built into the
# compose image), this cache serves canonical /data/{id}/{z}/{x}/{y}.png
# requests for the source below. Without the patch (published ghcr.io
# image), only Accept-Encoding re-encode variants are cached.
#
# ttl_seconds trades freshness vs cost: dynamic STAC tiles freeze for the TTL.
# ---------------------------------------------------------------------------
[cache]
enabled = true
max_size_mb = 512
ttl_seconds = 3600

# ---------------------------------------------------------------------------
# Source: Sentinel-2 L2A via Earth Search STAC — dynamic mosaic
#
# dynamic = true: EVERY tile request triggers a STAC POST /search with the
# tile's WGS-84 bbox. max_items = 5: up to 5 intersecting items are rendered
# concurrently and composited (Phase 3 mosaic); a single intersecting item
# renders directly (Phase 2). pixel_selection = "first": first opaque pixel
# wins, short-circuits (lowest latency). Other options: lowest_cloud_cover,
# most_recent, mean, median, stdev — see
# ../tileserver-rs/apps/docs/content/4.guides/15.stac.md.
#
# stac_bbox anchors the source bounds exposed to clients (TileJSON); per-tile
# search still uses the actual tile bbox. Region: South Sudan / East Africa.
# asset_role = "visual": the true-color 3-band JPEG asset (verified live on
# Earth Search items) — renders as RGB, no colormap (colormap requires 1 band).
# ---------------------------------------------------------------------------
[[sources]]
id = "sentinel2-mosaic"
type = "stac"
path = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-l2a"
asset_role = "visual"
dynamic = true
max_items = 5
pixel_selection = "first"
stac_bbox = [26.0, 4.5, 27.0, 5.5]
minzoom = 0
maxzoom = 14
