# ============================================================================
# tileserver-rs configuration — Tileserver-RS demo sources
#
# Motivation: demonstrate server-side COG rendering + in-process caching.
#
# One source:
#   manila-rgb — the SAME true-color RGB COG the TiTiler "Manila RGB" demo
#                uses (Manila Sentinel-2 composite, uint8 3-band, EPSG:3857,
#                DEFLATE COG), served by tileserver-rs instead of TiTiler.
#                Proven healthy; a faithful apples-to-apples demo.
#
# HISTORY 2026-10-14 (this demo was previously STAC-based, both entries
# removed):
#   - sentinel2-mosaic (Earth Search STAC, dynamic per-tile /search + mosaic):
#     removed — the STAC configuration test case failed. Low-zoom tiles were
#     mostly black because the top-5 newest scenes around the region are
#     89-99 % cloud and `pixel_selection = "first"` picks by STAC rank, not
#     cloud cover, so canvas pixels came from cloudy/nodata items. Only at
#     high zoom (small bbox) did a low-cloud scene enter the result set and
#     the tiles converge to real imagery. A STAC demo is not worth keeping
#     until a reliable, low-cloud, overlapping-scene data source is available.
#   - worldcereal (same COG as the TiTiler WorldCereal demo + discrete
#     colormap): removed earlier — failed at startup registration (GDAL
#     'GDALOpenEx' returned NULL, "Failure writing output to destination").
#     The public WorldCereal STAC API is dead (stac.worldcereal.org NXDOMAIN).
#
# Tiles:    /data/{source-id}/{z}/{x}/{y}.png
# TileJSON: /data/{source-id}.json
# ============================================================================

[server]
host = "0.0.0.0"
port = 8080
cors_origins = ["*"]

[telemetry]
enabled = false

# ---------------------------------------------------------------------------
# Global raster defaults.
# ---------------------------------------------------------------------------
[raster]
default_resampling = "bilinear"
tile_size = 256

# ---------------------------------------------------------------------------
# In-process byte-weighted tile cache (moka). With the identity-raster-cache
# patch (../tileserver-rs, branch feat/identity-raster-cache — built into the
# compose image), this cache serves canonical /data/{id}/{z}/{x}/{y}.png
# requests for the source below. Without the patch (published ghcr.io
# image), only Accept-Encoding re-encode variants are cached.
# ---------------------------------------------------------------------------
[cache]
enabled = true
max_size_mb = 512
ttl_seconds = 3600

# ---------------------------------------------------------------------------
# Source: Manila Sentinel-2 RGB composite (uint8 3-band COG, EPSG:3857)
#
# The SAME COG the TiTiler "Manila RGB" demo renders
# (src/maps/TiTilerDemo/ManilaRGB/index.jsx). True RGB — no colormap
# (colormap applies only when band_count == 1; this is 3 bands, so RGB tiles
# are served straight). Native resolution ≈ zoom 14-15 (10 m Sentinel-2);
# bilinear is the sensible default for imagery.
#
# Bounds (from TiTiler /cog/info, EPSG:3857): lon 118.13-123.75,
# lat 11.13-16.58 — Luzon-wide composite. maxzoom 15 keeps the demo honest:
# beyond native res tiles are upsampled and the TiTiler demo does not zoom
# further either (its TileLayer maxZoom = 16).
# ---------------------------------------------------------------------------
[[sources]]
id = "manila-rgb"
type = "cog"
path = "https://eu-central-1.linodeobjects.com/gisat-data/3DFlus_GST-22/deck.gl-geotiff/examples/dataSources/cog_bitmap/Manila_S2_Composite_2020022_Mercator_RGB_COG_DEFLATE.tif"
name = "Manila Sentinel-2 RGB Composite"
attribution = "Sentinel-2 composite (Gisat demo data)"
resampling = "bilinear"
minzoom = 0
maxzoom = 15
