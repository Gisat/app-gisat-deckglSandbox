# =============================================================================
# EXAMPLE — production reverse proxy (front door) for the app + TiTiler DEMO.
# =============================================================================
# The outermost proxy that terminates the public origin and ROUTES to the app
# and to the TiTiler services. It does not render or cache tiles itself.
#
# This proxy runs as a CONTAINER on the SAME docker network as the app and the
# tile stack, so it reaches them by docker SERVICE NAME (not host ports). The
# TiTiler service is therefore NOT published to the host at all.
#
# Routing (all SAME-ORIGIN, matching the app's relative endpoints in
# src/maps/TiTilerDemo/shared/endpoints.js):
#
#   GET /…                -> app (web mode)                    app:5000
#   GET /titiler-plain/…  -> TiTiler, DIRECT / uncached        titiler:8000
#   GET /titiler/api/…    -> tile stack nginx, CACHED          nginx:80
#                              /api/v1/titiler/   (TiTiler, cached)
#                              /api/v1/terrarium/ (encoder)
#                              /api/v1/float32/   (encoder)
#
# `titiler` and `nginx` are the service names from
# deploy/titiler-combined/docker-compose.yml; `app` is the web-mode app service.
# Publishing this proxy on a host port (e.g. -p 3000:80) is the ONLY host
# exposure in the whole deployment.
#
# Deploy as a site include: drop this file in /etc/nginx/conf.d/ (its
# `upstream`/`server` blocks belong in the `http {}` context) and publish :80.
# If instead the proxy runs OUTSIDE docker, replace each service name with the
# corresponding host port (see the note at the bottom).
#
# Why this is needed in production: the app image (serve_web.py) serves static
# files only and has no proxy; in development the Vite dev server does this
# proxying (vite.config.js server.proxy). Without a front door, the app's two
# relative prefixes (/titiler-plain, /titiler/api) would 404.
#
# Caching still happens in the tile stack's nginx (`nginx`, :80); this proxy
# only routes. The DIRECT prefix (titiler:8000) intentionally bypasses caching.
# =============================================================================

upstream app_backend {
    server app:5000;         # app container (Dockerfile EXPOSE 5000)
    keepalive 16;
}

# The single TiTiler, reached directly on the docker network (uncached).
upstream titiler_direct {
    server titiler:8000;     # deploy/titiler-combined -> titiler
    keepalive 32;
}

# The tile stack's caching nginx (disk tile cache + terrarium/float32 encoders).
upstream titiler_cache {
    server nginx:80;         # deploy/titiler-combined -> nginx
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # TLS: terminate here (or at your load balancer) and redirect 80 -> 443.
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/tls.crt;
    # ssl_certificate_key /etc/nginx/certs/tls.key;

    # The COG `url=` param alone can exceed nginx's default 8 KB request line.
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # ---- app (SPA, web mode) ----
    # SPA fallback / sub-path base are handled by the app image (serve_web.py).
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- TiTiler DEMO — DIRECT / uncached ("TiTiler (plain)" entry) ----
    # /titiler-plain/cog/tiles/… -> titiler:8000/cog/tiles/…
    # The trailing "/" on proxy_pass strips the /titiler-plain/ prefix.
    location /titiler-plain/ {
        proxy_pass http://titiler_direct/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- TiTiler DEMO — CACHED ("TiTiler + cache" entry) ----
    # /titiler/api/v1/titiler/cog/tiles/…    -> tile-nginx /api/v1/titiler/cog/tiles/…
    # /titiler/api/v1/terrarium/8/80/140.png -> tile-nginx /api/v1/terrarium/8/80/140.png
    # /titiler/api/v1/float32/8/80/140.f32   -> tile-nginx /api/v1/float32/8/80/140.f32
    # The trailing "/api/" on proxy_pass rewrites /titiler/api/ -> /api/.
    location /titiler/api/ {
        proxy_pass http://titiler_cache/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tile bodies can be large; keep nginx's default buffering.
    }

    # Longest-prefix match already separates /titiler-plain/ and /titiler/api/.
    # Do NOT add a blanket `location /titiler/` — it would shadow both above.
}

# If this proxy is NOT a container on the app's network, drop the `upstream`
# blocks and use host ports directly, e.g.:
#   proxy_pass http://127.0.0.1:5000;              # app
#   proxy_pass http://127.0.0.1:8000/;             # titiler (direct)
#   proxy_pass http://127.0.0.1:8001/api/;         # tile-cache nginx
# (and publish 8000/8001 from the tile stack).
