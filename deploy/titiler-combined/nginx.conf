# nginx for the single-TiTiler stack (deploy/titiler-combined).
#
# Proxies and disk-caches three tile producers, all on the compose network:
#   /api/v1/titiler/...   -> the ONE `titiler` service (:8000)   [tiles cached]
#   /api/v1/terrarium/... -> `terrarium` encoder (:8000)          [always cached]
#   /api/v1/float32/...   -> `float32` encoder (:8000)            [always cached]
#
# Direct/uncached access to the same TiTiler bypasses nginx entirely
# (host :8000, published by the titiler service).

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;

    # Gzip the raw float32 encoder responses (application/octet-stream): a DEM is
    # highly compressible, so the 262,144-byte stream shrinks on the wire.
    # gzip_vary appends `Vary: Accept-Encoding` so caches don't serve a gzipped
    # body to a client that can't decode it.
    gzip on;
    gzip_types application/octet-stream;
    gzip_vary on;
    gzip_min_length 256;

    # The COG `url=` param alone can exceed nginx's default 8 KB request line,
    # which would 414 before proxying. 32k keeps it within headroom.
    large_client_header_buffers 4 32k;

    # ---- disk cache for rendered tiles ----
    proxy_cache_path /var/cache/nginx/tiles
        keys_zone=tiles:50m
        levels=1:2
        inactive=14d
        max_size=10g
        use_temp_path=off;

    # The single TiTiler.
    upstream titiler {
        server titiler:8000;
        keepalive 32;
    }

    # Sibling elevation encoders (resolved at nginx startup).
    upstream terrarium {
        server terrarium:8000;
        keepalive 16;
    }

    upstream float32 {
        server float32:8000;
        keepalive 16;
    }

    server {
        listen 80;

        # health check passthrough (never cached)
        location = /healthz {
            proxy_pass http://titiler;
            proxy_set_header HOST $http_host;
        }

        # Terrarium encoder: Mapzen-style elevation tiles, cached like tile output.
        location /api/v1/terrarium/ {
            rewrite ^/api/v1/terrarium(.*)$ $1 break;

            proxy_pass http://terrarium;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header HOST $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache tiles;
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Raw float32 encoder: headerless little-endian float32 elevation tiles.
        location /api/v1/float32/ {
            rewrite ^/api/v1/float32(.*)$ $1 break;

            proxy_pass http://float32;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header HOST $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache tiles;
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # TiTiler, cached for tile endpoints only.
        location /api/v1/titiler/ {
            rewrite ^/api/v1/titiler(.*)$ $1 break;

            proxy_pass http://titiler;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header HOST $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache only /tiles/ requests; metadata/info/statistics pass through.
            # Match on $request_uri (original request line, untouched by rewrite).
            set $no_cache 1;
            if ($request_uri ~ "/tiles/") {
                set $no_cache 0;
            }
            proxy_no_cache $no_cache;
            proxy_cache_bypass $no_cache;

            proxy_cache tiles;
            # full query string is part of the tile identity (url=, rescale=, bidx=, ...)
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            return 404;
        }
    }
}
