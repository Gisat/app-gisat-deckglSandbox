worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;

    # Long tile URLs: the DEMO COGs pass the full 256-entry colormap inline as
    # url-encoded JSON in the query string (~9-11 KB request line; nginx's
    # default 8 KB buffer would 414 them before proxying). One buffer of 32k
    # caps the request line at ~32 KB - plenty of headroom.
    large_client_header_buffers 4 32k;

    # ---- disk cache for rendered tiles ----
    # levels=1:2 + use_temp_path=off = standard fast cache layout
    proxy_cache_path /var/cache/nginx/tiles
        keys_zone=tiles:50m
        levels=1:2
        inactive=14d
        max_size=10g
        use_temp_path=off;

    upstream titiler {
        server titiler:8081;
        keepalive 32;
    }

    server {
        listen 80;

        # health check passthrough (never cached)
        location = /healthz {
            proxy_pass http://titiler;
            proxy_set_header HOST $http_host;
        }

        location /api/v1/titiler/ {
            rewrite ^/api/v1/titiler(.*)$ $1 break;

            proxy_pass http://titiler;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header HOST $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---- cache only tile endpoints, never metadata/info ----
            # Match on $request_uri (the ORIGINAL request line, untouched by the
            # rewrite above). $uri is rewritten in-place by `rewrite ... break`,
            # and with very long query strings (the DEMO COGs pass the full
            # 256-entry colormap inline) matching the rewritten $uri here proved
            # unreliable -> $no_cache stayed 1 -> no caching, no X-Cache-Status.
            set $no_cache 1;
            if ($request_uri ~ "/tiles/") {
                set $no_cache 0;
            }
            proxy_no_cache $no_cache;
            proxy_cache_bypass $no_cache;

            # ---- caching policy ----
            proxy_cache tiles;
            # full query string is part of the tile identity (url=, rescale=, bidx=, ...)
            proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
            proxy_cache_valid 200 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;              # one upstream request per cold tile
            proxy_cache_lock_timeout 10s;
            proxy_cache_background_update on; # serve stale while refreshing

            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            return 404;
        }
    }
}
